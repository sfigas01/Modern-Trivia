name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Agent manual sync check
        run: |
          set -euo pipefail

          for f in AGENTS.md CLAUDE.md replit.md; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Missing required shared agent file: $f"
              exit 1
            fi
          done

          if ! cmp -s AGENTS.md CLAUDE.md; then
            echo "::error::AGENTS.md and CLAUDE.md must remain identical."
            diff -u AGENTS.md CLAUDE.md || true
            exit 1
          fi

          if ! cmp -s AGENTS.md replit.md; then
            echo "::error::AGENTS.md and replit.md must remain identical."
            diff -u AGENTS.md replit.md || true
            exit 1
          fi

          if [ -f .cursorrules ]; then
            echo "::error::.cursorrules is deprecated and should not exist."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build
